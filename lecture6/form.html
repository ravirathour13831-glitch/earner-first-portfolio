<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <form action="welcompage.html" target="_blank">

            <fieldset>
                <legend>enter your basic information</legend>
            <label for="fullname">full name: </label>
            <input type="text" id="fullname" placeholder="enter your name"required>
            <br><br>
            <label for="email">email : </label>
            <input type="email" id="email" placeholder="enter your email" required>
            <br><br>
            <label for="password">password : </label>
            <input type="password" id="password" placeholder="enter your password" required>
           <br><br>
           <label for="checkbox"> are you 18+</label>
           <input type="checkbox" id="checkbox" required>
           <br><br>
           <label for="phonenumber">enter your phone number : </label>
           <input type="number" id="phonenumber" placeholder="enter phone number" required minlenght="10" min="0" maxlength="10">
           <br><br>
           <label for="gender">gender: </label>
           <label for="gender">male</label>
           <input type="radio" id="gender" name="gender"required>
           <label for="gender">female </label>
           <input type="radio" id="gender" name="gender">
           <br><br>
           <label for="date">enter your DOB</label>
           <input type="date" id="date">
           <br><br>
           <label for="file">upload photo</label>
           <input type="file" id="file">
            <br><br>
           <select name="" id="city">
            <option value="delhi">delhi</option>
            <option value="mumbai">mumbai</option>
            <option value="jaipur">jaipur</option>
            <option value="noida">noida</option>
            <option value="lucknow">lucknow</option>
           </select>
           <br><br>
           <button type="submit">submit form</button>
           </fieldset>

           

        </form>
    </div>
    
</body>
</html>
